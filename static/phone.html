<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handy Phone</title>
<style>
  :root {
    --bg: #0b0d14;
    --panel: rgba(255, 255, 255, 0.05);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #e8eaf2;
    --muted: #8b90a5;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(700px 400px at 0% -10%, rgba(124, 92, 255, 0.28), transparent 60%),
      radial-gradient(600px 400px at 100% 0%, rgba(34, 211, 238, 0.16), transparent 60%),
      var(--bg);
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
  }
  h1 { margin: 0; font-size: 18px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    background: var(--panel); border: 1px solid var(--panel-border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip.good .dot { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .chip.warn .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .chip.bad  .dot { background: var(--bad);  box-shadow: 0 0 10px var(--bad); }

  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px; backdrop-filter: blur(12px); }
  .stage-card { padding: 10px; }
  .stage { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
    background: rgba(11, 13, 20, 0.82);
  }
  #overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 10px; }
  button {
    font: inherit; font-weight: 600; font-size: 15px; color: var(--text);
    padding: 14px 16px; border-radius: 14px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-border);
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; }
  button.primary {
    border: none;
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    box-shadow: 0 6px 20px rgba(124, 92, 255, 0.35);
  }
  button.wide { grid-column: 1 / -1; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 10px 4px 2px; }

  .gallery-head { display: flex; justify-content: space-between; align-items: center; margin: 22px 4px 10px; }
  .gallery-head h2 { margin: 0; font-size: 16px; }
  .count { margin-left: 8px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: rgba(124, 92, 255, 0.25); color: #c9bdff; }
  .link-btn { background: none; border: none; padding: 4px 6px; color: var(--muted); font-size: 13px; font-weight: 500; }

  #gallery { display: flex; flex-direction: column; gap: 12px; }
  .shot { border-radius: 14px; overflow: hidden; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--panel-border); animation: pop 0.25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
  .shot img { width: 100%; display: block; background: #000; }
  .shot-info { padding: 10px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .shot-info strong { color: var(--text); font-size: 13.5px; }
  .shot-row { display: flex; justify-content: space-between; align-items: center; }
  .shot a { color: var(--accent-2); text-decoration: none; font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 28px 10px; line-height: 1.6; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    max-width: 90vw; padding: 12px 18px; border-radius: 12px; font-size: 14px; text-align: center;
    opacity: 0; pointer-events: none; background: #1b1e2b; border: 1px solid var(--panel-border);
    transition: opacity 0.2s, transform 0.2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">&#9995;</div>
      <h1>Handy Phone</h1>
    </div>
    <div id="chip" class="chip"><span class="dot"></span><span id="chipText">Camera off</span></div>
  </header>

  <section class="card stage-card">
    <div class="stage" id="stage">
      <canvas id="view" width="480" height="640"></canvas>
      <video id="video" playsinline muted autoplay></video>
      <div id="overlay">
        <p>Your phone's camera is sent to your PC for hand tracking.<br>Prop the phone up so both hands are in view.</p>
        <button class="primary" id="startBtn">Start camera</button>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="captureBtn" disabled>Capture</button>
      <button id="resetBtn" disabled>Clear square</button>
      <button class="wide" id="stopBtn" disabled>Stop camera</button>
    </div>
    <div class="hint">Pinch thumb + index on <b>both</b> hands to draw. Release to lock the square, then tap Capture.</div>
  </section>

  <div class="gallery-head">
    <h2>Captures <span class="count" id="count">0</span></h2>
    <button class="link-btn" id="clearAllBtn">Delete all</button>
  </div>
  <div id="gallery"></div>
</div>

<div id="toast"></div>

<script>
  // ---------- settings you can tweak ----------
  const MAX_SIDE = 640;        // frames are shrunk so their longest side is this many pixels
  const JPEG_QUALITY = 0.7;    // 0 to 1 (lower = faster but blurrier)
  const MIN_INTERVAL_MS = 66;  // about 15 frames per second at most

  // ---------- page elements ----------
  const video = document.getElementById("video");
  const view = document.getElementById("view");
  const vctx = view.getContext("2d");
  const stage = document.getElementById("stage");
  const overlay = document.getElementById("overlay");
  const chip = document.getElementById("chip");
  const chipText = document.getElementById("chipText");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const captureBtn = document.getElementById("captureBtn");
  const resetBtn = document.getElementById("resetBtn");
  const gallery = document.getElementById("gallery");
  const countEl = document.getElementById("count");
  const toast = document.getElementById("toast");

  const grab = document.createElement("canvas");   // used to shrink each camera frame
  let ws = null;
  let stream = null;
  let running = false;
  let waiting = false;     // true while we wait for the PC to send the processed frame back
  let lastSend = 0;
  let captures = [];

  // ---------- small helpers ----------
  let toastTimer;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
  }
  function setChip(kind, text) {
    chip.className = "chip " + kind;
    chipText.textContent = text;
  }
  function setRunningUI(on) {
    overlay.style.display = on ? "none" : "flex";
    captureBtn.disabled = !on;
    resetBtn.disabled = !on;
    stopBtn.disabled = !on;
    startBtn.disabled = false;
  }

  // ---------- start / stop ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast("Camera needs a secure page. Open the https:// address.");
      return;
    }
    startBtn.disabled = true;
    setChip("warn", "Starting camera...");
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false,
      });
    } catch (e) {
      setChip("bad", "Camera blocked");
      showToast("Could not open the camera: " + e.name);
      startBtn.disabled = false;
      return;
    }
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* autoplay will handle it */ }
    connect();
  }

  function stopCamera() {
    running = false;
    waiting = false;
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    setRunningUI(false);
    setChip("", "Camera off");
  }

  // ---------- talking to the PC ----------
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    setChip("warn", "Connecting...");
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      running = true;
      waiting = false;
      setRunningUI(true);
      setChip("warn", "Pinch both hands to draw");
      sendFrame();
    };
    ws.onmessage = onMessage;
    ws.onclose = () => {
      if (running) {                 // closed unexpectedly (not by the Stop button)
        showToast("Lost connection to the PC");
        stopCamera();
        setChip("bad", "Disconnected");
      }
    };
    ws.onerror = () => {
      if (!running) {
        showToast("Could not reach the PC. Is phone_server.py running?");
        stopCamera();
        setChip("bad", "Can't connect");
      }
    };
  }

  function sendFrame() {
    if (!running || waiting || !ws || ws.readyState !== 1) return;
    if (video.videoWidth === 0) { setTimeout(sendFrame, 50); return; }

    const wait = MIN_INTERVAL_MS - (performance.now() - lastSend);
    if (wait > 0) { setTimeout(sendFrame, wait); return; }

    const scale = Math.min(1, MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
    grab.width = Math.round(video.videoWidth * scale);
    grab.height = Math.round(video.videoHeight * scale);
    grab.getContext("2d").drawImage(video, 0, 0, grab.width, grab.height);

    waiting = true;
    lastSend = performance.now();
    grab.toBlob((blob) => {
      if (!blob || !ws || ws.readyState !== 1) { waiting = false; return; }
      ws.send(blob);
    }, "image/jpeg", JPEG_QUALITY);
  }

  async function onMessage(ev) {
    // text = status / capture / error messages
    if (typeof ev.data === "string") {
      const m = JSON.parse(ev.data);
      if (m.type === "status") {
        setChip(m.has_square ? "good" : "warn", m.has_square ? "Square locked" : "Pinch both hands to draw");
      } else if (m.type === "capture") {
        addCapture(m);
        showToast("Captured!");
      } else if (m.type === "error") {
        showToast(m.detail);
      } else if (m.type === "skip") {
        waiting = false;
        sendFrame();
      }
      return;
    }

    // binary = the processed frame coming back from the PC
    const bmp = await createImageBitmap(ev.data);
    if (view.width !== bmp.width || view.height !== bmp.height) {
      view.width = bmp.width;
      view.height = bmp.height;
      stage.style.aspectRatio = bmp.width + " / " + bmp.height;
    }
    vctx.drawImage(bmp, 0, 0);
    bmp.close();
    waiting = false;
    sendFrame();
  }

  // if the PC stops answering for 3 seconds, try again
  setInterval(() => {
    if (running && waiting && performance.now() - lastSend > 3000) {
      waiting = false;
      sendFrame();
    }
  }, 1000);

  // ---------- buttons ----------
  function send(cmd) { if (ws && ws.readyState === 1) ws.send(cmd); }

  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);
  captureBtn.addEventListener("click", () => send("capture"));
  resetBtn.addEventListener("click", () => { send("reset"); showToast("Square cleared"); });
  document.getElementById("clearAllBtn").addEventListener("click", () => { captures = []; renderGallery(); });

  // ---------- gallery (kept on the phone, so nothing is stored on the PC) ----------
  function addCapture(m) {
    captures.unshift(m);
    renderGallery();
  }

  function renderGallery() {
    countEl.textContent = captures.length;
    gallery.replaceChildren();

    if (captures.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No captures yet. Draw a square, then tap Capture.";
      gallery.appendChild(empty);
      return;
    }

    for (const c of captures) {
      const card = document.createElement("div");
      card.className = "shot";

      const img = document.createElement("img");
      img.src = "data:image/jpeg;base64," + c.image;
      img.alt = "Capture " + c.id;

      const info = document.createElement("div");
      info.className = "shot-info";

      const row = document.createElement("div");
      row.className = "shot-row";
      const title = document.createElement("strong");
      title.textContent = `#${c.id} · ${c.width}×${c.height}`;
      const dl = document.createElement("a");
      dl.href = img.src;
      dl.download = `capture_${c.id}.jpg`;
      dl.textContent = "Download";
      row.append(title, dl);

      const coords = document.createElement("div");
      coords.textContent = `Top-left (${c.x1}, ${c.y1}) · Bottom-right (${c.x2}, ${c.y2})`;
      const meta = document.createElement("div");
      meta.textContent = `Frame ${c.frame_width}×${c.frame_height} · ${c.time}`;

      info.append(row, coords, meta);
      card.append(img, info);
      gallery.appendChild(card);
    }
  }

  renderGallery();
</script>
</body>
</html>
